name: Lua validation

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - name: Validate Lua syntax
        run: luac -p Core.lua Classification.lua ZoneMap.lua Data.lua Waypoints.lua Search.lua Pins.lua UI.lua Minimap.lua tests/run.lua
      - name: Run pure Lua regression tests
        run: lua tests/run.lua
